<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="ACH3.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log In · AC Hash</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  body{padding-block:28px;display:flex;justify-content:center;overflow:hidden}
  .login-box{width:100%;max-width:340px}
  .login-box .page-h{text-align:center;margin-bottom:16px}
  .login-box label{display:block;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--muted);margin:14px 0 6px}
  .login-box label:first-of-type{margin-top:0}
  .login-box input{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  .login-box input:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .login-box button{margin-top:20px;width:100%;font:inherit;font-weight:700;padding:11px 16px;border:0;border-radius:999px;background:var(--accent);color:var(--ink);cursor:pointer}
  .login-box button:hover{filter:brightness(1.05)}
  .register{margin:4px 0 0;font-size:.82rem;line-height:1.4;text-align:center;color:var(--muted)}
  .register a{color:var(--ink);font-weight:600}
  .msg{margin-top:12px;font-size:.9rem;color:#8a2a1a;min-height:1.2em;text-align:center}
</style>
</head>
<body>
<div class="login-box">
  <h1 class="page-h">Log In</h1>
  <form class="panel" id="loginForm" autocomplete="off">
    <label for="name">Name</label>
    <input id="name" name="name" type="text" required autofocus>
    <label for="pw">Passwort</label>
    <input id="pw" name="pw" type="password" required>
    <button type="submit">Log In</button>
    <p class="msg" id="msg" role="status"></p>
    <p class="register">To register, send your name and your desired password to <a href="mailto:tuloy@ymail.com">tuloy@ymail.com</a></p>
  </form>
</div>
<script src="pw.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var name = document.getElementById('name').value.trim();
  var pw = document.getElementById('pw').value;
  var msg = document.getElementById('msg');
  if (typeof MEMBERS === 'undefined') {
    msg.textContent = 'pw.js konnte nicht geladen werden.';
    return;
  }
  var ok = MEMBERS.some(function (m) {
    return m.name.toLowerCase() === name.toLowerCase() && m.password === pw;
  });

  var embedded = window.parent !== window;

  if (!ok) {
    // Falscher Name oder Passwort: Log-In-Fenster schliessen
    if (embedded) { window.parent.postMessage({ type: 'login-fail' }, '*'); return; }
    msg.textContent = 'Name oder Passwort falsch.';
    return;
  }

  // Richtig: eingabe.html öffnen (im Hauptfenster)
  if (embedded) { window.parent.postMessage({ type: 'login-ok', name: name }, '*'); return; }
  try { sessionStorage.setItem('achhh_member', name); } catch (err) {}
  location.href = 'eingabe.html';
});
</script>
</body>
</html>
